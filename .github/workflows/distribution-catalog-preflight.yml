name: Distribution catalog read-only preflight

on:
  workflow_dispatch:
    inputs:
      request_json:
        description: Exact reviewed catalog preflight request JSON
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: distribution-catalog-readonly-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    environment: distribution-catalog-preflight
    steps:
      - name: Check out the inert catalog baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up exact Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12.10
          cache: pip
          cache-dependency-path: tools/requirements-distribution-catalog.txt

      - name: Install the pinned catalog validator
        run: >-
          python -m pip install
          --disable-pip-version-check
          --requirement tools/requirements-distribution-catalog.txt

      - name: Materialize the bounded reviewed request
        shell: python
        env:
          REQUEST_JSON: ${{ inputs.request_json }}
        run: |
          import os
          from pathlib import Path

          value = os.environ["REQUEST_JSON"].encode("utf-8")
          if not value or len(value) > 65536:
              raise SystemExit("catalog preflight request size is outside its bound")
          Path("catalog-preflight-request.json").write_bytes(value)

      - name: Validate the inert source and offline damage matrix
        run: |
          python tools/test_distribution_catalog.py
          python tools/test_distribution_catalog_preflight.py

      - name: Perform live owner readback without publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/preflight_distribution_catalog.py \
            --request catalog-preflight-request.json \
            --require-complete-alpha-set \
            --out-catalog _catalog-preflight/catalog.generated.json \
            --out-receipt _catalog-preflight/readback.receipt.json

      - name: Retain private review evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution-catalog-readonly-preflight-${{ github.run_id }}
          path: _catalog-preflight/
          if-no-files-found: error
          retention-days: 7
